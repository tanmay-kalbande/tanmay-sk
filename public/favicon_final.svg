<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#1e1916"/>
      <stop offset="100%" stop-color="#0d0d0c"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea6c33"/>
      <stop offset="100%" stop-color="#c8451a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8672f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8672f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- glow behind sparkle star -->
  <circle cx="32" cy="21" r="13" fill="url(#glow)"/>

  <!-- Book spine -->
  <line x1="32" y1="21" x2="32" y2="46" stroke="url(#stroke)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Left page curve -->
  <path d="M 32 24 C 26 20, 19 21, 15 23.5 L 15 42.5 C 19 40.5, 26 39.5, 32 43.5" fill="none" stroke="url(#stroke)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right page curve -->
  <path d="M 32 24 C 38 20, 45 21, 49 23.5 L 49 42.5 C 45 40.5, 38 39.5, 32 43.5" fill="none" stroke="url(#stroke)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central sparkle (4-point star) -->
  <path d="M32 14.5 C33 19 33 19 38.5 21 C33 23 33 23 32 27.5 C31 23 31 23 25.5 21 C31 19 31 19 32 14.5 Z" fill="url(#stroke)"/>
  <circle cx="32" cy="21" r="1.5" fill="#fff2ea" fill-opacity="0.95"/>

  <!-- Scattered constellation dots -->
  <line x1="55" y1="10" x2="57" y2="30" stroke="#c8451a" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="9" y1="12" x2="6" y2="34" stroke="#c8451a" stroke-width="1" stroke-opacity="0.2"/>

  <circle cx="9" cy="12" r="1.4" fill="#c8451a" fill-opacity="0.85"/>
  <circle cx="55" cy="10" r="1.1" fill="#c8451a" fill-opacity="0.75"/>
  <circle cx="57" cy="30" r="1.2" fill="#f0f0ee" fill-opacity="0.35"/>
  <circle cx="52" cy="52" r="1" fill="#c8451a" fill-opacity="0.55"/>
  <circle cx="11" cy="50" r="1.3" fill="#f0f0ee" fill-opacity="0.3"/>
  <circle cx="6" cy="34" r="0.9" fill="#c8451a" fill-opacity="0.5"/>
  <circle cx="44" cy="7" r="0.8" fill="#f0f0ee" fill-opacity="0.4"/>
  <circle cx="22" cy="55" r="0.9" fill="#c8451a" fill-opacity="0.45"/>

  <!-- Border -->
  <rect x=".5" y=".5" width="63" height="63" rx="12.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
</svg>
