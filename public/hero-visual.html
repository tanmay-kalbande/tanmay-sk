<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .visual-wrap { position: relative; width: 100%; height: 100%; cursor: crosshair; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .corner { position: absolute; font: 400 12px "Roboto Mono", ui-monospace, monospace; color: rgba(224,90,53,0.5); user-select: none; pointer-events: none; z-index: 4; transition: color .4s ease, opacity .4s ease; animation: cornerBreathe 4s ease-in-out infinite; }
    @keyframes cornerBreathe { 0%,100%{ opacity:.6 } 50%{ opacity:.95 } }
    .tl { top:8px; left:10px; } .tr { top:8px; right:10px; } .bl { bottom:8px; left:10px; } .br { bottom:8px; right:10px; }
    .visual-wrap:hover .corner { color: rgba(240,237,232,0.85); animation: none; opacity: 1; }
    .tag { position: absolute; right: 18px; bottom: 14px; color: rgba(240,237,232,0.35); font: 600 10px "Roboto Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; z-index: 4; pointer-events: none; transition: color .4s ease; }
    .visual-wrap:hover .tag { color: rgba(224,90,53,0.85); }
  </style>
</head>
<body>
  <div class="visual-wrap" id="wrap">
    <canvas id="terrain"></canvas>
    <span class="corner tl">+</span>
    <span class="corner tr">+</span>
    <span class="corner bl">+</span>
    <span class="corner br">+</span>
    <span class="tag">LEARN / BUILD / GROW</span>
  </div>
  <script>
  (function(){
    const container=document.getElementById("wrap"),canvas=document.getElementById("terrain"),ctx=canvas.getContext("2d");
    let dpr=Math.min(window.devicePixelRatio||1,2);
    const COLS=64,ROWS=42,mouse={x:.5,y:.5,active:false};
    const ANCHORS=[{nx:.5,ny:.5,amp:.42,r:.085,label:null,isHub:true},{nx:.2,ny:.24,amp:.9,r:.06,label:"TECH",shape:"diamond"},{nx:.8,ny:.21,amp:1,r:.055,label:"AI",shape:"square"},{nx:.17,ny:.8,amp:.78,r:.06,label:"FINANCE",shape:"triangle"},{nx:.83,ny:.8,amp:.84,r:.06,label:"ENG",shape:"circle"}];
    const HUB=ANCHORS[0],DOMAINS=ANCHORS.slice(1),ROT_DEG=30,phases=DOMAINS.map((_,i)=>i/DOMAINS.length);
    function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453123;return s-Math.floor(s);}
    function noise2D(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
    function fbm(x,y){let s=0,amp=.5,f=1;for(let i=0;i<3;i++){s+=noise2D(x*f,y*f)*amp;amp*=.5;f*=2.1;}return s;}
    function terrainHeight(nx,ny,t){let h=0;for(const a of ANCHORS){const dx=nx-a.nx,dy=ny-a.ny;h+=a.amp*Math.exp(-(dx*dx+dy*dy)/(2*a.r*a.r));}h+=fbm(nx*3.2+t*6,ny*3.2+t*4.6)*.14;return h;}
    function lerp(a,b,u){return a+(b-a)*u;}
    function lerpColor(a,b,u){return[0,1,2].map(i=>Math.round(lerp(a[i],b[i],u)));}
    const COL_DEEP=[58,18,16],COL_MID=[224,90,53],COL_PEAK=[240,237,232];
    function heightColor(n){n=Math.max(0,Math.min(1,n));const[r,g,b]=n<.55?lerpColor(COL_DEEP,COL_MID,n/.55):lerpColor(COL_MID,COL_PEAK,(n-.55)/.45);return`rgba(${r},${g},${b},0.92)`;}
    function resize(){const rect=container.getBoundingClientRect();canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;canvas.style.width=rect.width+"px";canvas.style.height=rect.height+"px";ctx.setTransform(dpr,0,0,dpr,0,0);}
    resize();window.addEventListener("resize",resize);
    container.addEventListener("pointermove",e=>{const rect=container.getBoundingClientRect();mouse.x=(e.clientX-rect.left)/rect.width;mouse.y=(e.clientY-rect.top)/rect.height;mouse.active=true;});
    container.addEventListener("pointerleave",()=>{mouse.active=false;});
    DOMAINS.forEach((d,i)=>{const mx=(HUB.nx+d.nx)/2,my=(HUB.ny+d.ny)/2,dx=d.nx-HUB.nx,dy=d.ny-HUB.ny,len=Math.hypot(dx,dy)||1,px=-dy/len,py=dx/len,bend=.1*(i%2===0?1:-1);d.cx=mx+px*bend;d.cy=my+py*bend;});
    function bezier(p0x,p0y,cx,cy,p1x,p1y,s){const u=1-s;return{x:u*u*p0x+2*u*s*cx+s*s*p1x,y:u*u*p0y+2*u*s*cy+s*s*p1y};}
    function drawHubIcon(x,y,scale,glow){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);const R=14,angle=i=>Math.PI/6+i*Math.PI/3;ctx.beginPath();for(let i=0;i<6;i++){const px=R*Math.cos(angle(i)),py=R*Math.sin(angle(i));i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.closePath();ctx.fillStyle="#0e0e10";ctx.fill();ctx.strokeStyle=`rgba(224,90,53,${.7+glow*.3})`;ctx.lineWidth=1.5;ctx.stroke();ctx.strokeStyle=`rgba(240,237,232,${.3+glow*.3})`;ctx.lineWidth=1;for(let i=0;i<6;i++){const px=R*.82*Math.cos(angle(i)),py=R*.82*Math.sin(angle(i));ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(px,py);ctx.stroke();}ctx.fillStyle=`rgba(224,90,53,${.6+glow*.4})`;for(let i=0;i<6;i++){const px=R*.82*Math.cos(angle(i)),py=R*.82*Math.sin(angle(i));ctx.beginPath();ctx.arc(px,py,1.6,0,Math.PI*2);ctx.fill();}ctx.beginPath();ctx.arc(0,0,2.2,0,Math.PI*2);ctx.fillStyle=`rgba(240,237,232,${.7+glow*.3})`;ctx.fill();ctx.restore();}
    function drawMarker(x,y,size,shape,alpha){ctx.save();ctx.translate(x,y);ctx.fillStyle=`rgba(224,90,53,${alpha})`;ctx.beginPath();if(shape==="square"){ctx.rect(-size,-size,size*2,size*2);}else if(shape==="diamond"){ctx.moveTo(0,-size*1.35);ctx.lineTo(size*1.35,0);ctx.lineTo(0,size*1.35);ctx.lineTo(-size*1.35,0);ctx.closePath();}else if(shape==="triangle"){ctx.moveTo(0,-size*1.3);ctx.lineTo(size*1.2,size*.9);ctx.lineTo(-size*1.2,size*.9);ctx.closePath();}else{ctx.arc(0,0,size,0,Math.PI*2);}ctx.fill();ctx.restore();}
    let t=0,hoverAmt=0;
    function draw(){
      const w=canvas.width/dpr,h=canvas.height/dpr;
      hoverAmt+=((mouse.active?1:0)-hoverAmt)*.06;
      ctx.clearRect(0,0,w,h);ctx.fillStyle="#0e0e10";ctx.fillRect(0,0,w,h);
      const breathe=.5+.5*Math.sin(t*120);
      ctx.save();ctx.strokeStyle=`rgba(255,255,255,${.05+hoverAmt*.02})`;ctx.lineWidth=1;
      const gap=24,shear=h*.32,streakOffset=(t*900)%gap;
      for(let x=-h-gap;x<w+h;x+=gap){const sx=x+streakOffset;ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx+shear,h);ctx.stroke();}
      ctx.restore();
      t+=.00022+hoverAmt*.00035;
      const atX=Math.sin(t*42)*.05,atY=Math.cos(t*35)*.05,utX=(mouse.y-.5)*.5,utY=(mouse.x-.5)*.5;
      const tiltX=atX+(utX-atX)*hoverAmt,tiltY=atY+(utY-atY)*hoverAmt;
      const originX=w*.5,originY=h*.28,spanX=w*.86,spanY=h*.62,amp=h*.26;
      const ROT=ROT_DEG*Math.PI/180,cosR=Math.cos(ROT),sinR=Math.sin(ROT);
      function project(nx,ny,hh){const dx0=nx-.5,dy0=ny-.5,rx=.5+dx0*cosR-dy0*sinR,ry=.5+dx0*sinR+dy0*cosR,depth=.55+Math.max(0,Math.min(1,hh))*.45;return{x:originX+(rx-ry)*spanX*.5+tiltY*46*depth,y:originY+(rx+ry)*spanY*.5-hh*amp+tiltX*46*depth+Math.sin(nx*8+ny*5-t*55)*4};}
      for(let r=0;r<ROWS;r++){const ny=r/(ROWS-1);ctx.beginPath();let avg=0;for(let c=0;c<COLS;c++){const nx=c/(COLS-1),hh=terrainHeight(nx,ny,t);avg+=hh;const p=project(nx,ny,hh);c===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}avg/=COLS;ctx.strokeStyle=heightColor(avg/1.1);ctx.lineWidth=r/(ROWS-1)>.55?1.3:1;ctx.stroke();}
      DOMAINS.forEach((d,i)=>{
        const N=28;ctx.beginPath();
        for(let s=0;s<=N;s++){const u=s/N,b=bezier(HUB.nx,HUB.ny,d.cx,d.cy,d.nx,d.ny,u),hh=terrainHeight(b.x,b.y,t)+.05,p=project(b.x,b.y,hh);s===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
        ctx.setLineDash([3,4]);ctx.strokeStyle=`rgba(240,237,232,${.25+hoverAmt*.35})`;ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
        for(let s=1;s<4;s++){const u=s/4,b=bezier(HUB.nx,HUB.ny,d.cx,d.cy,d.nx,d.ny,u),hh=terrainHeight(b.x,b.y,t)+.05,p=project(b.x,b.y,hh);drawMarker(p.x,p.y,2,d.shape,.5+hoverAmt*.4);}
        phases[i]=(phases[i]+.0022+hoverAmt*.006)%1;
        const u=phases[i],b=bezier(HUB.nx,HUB.ny,d.cx,d.cy,d.nx,d.ny,u),hh=terrainHeight(b.x,b.y,t)+.06,p=project(b.x,b.y,hh);
        drawMarker(p.x,p.y,2.4,d.shape,.85);
        if(hoverAmt>.02){ctx.beginPath();ctx.strokeStyle=`rgba(224,90,53,${hoverAmt*.4})`;ctx.arc(p.x,p.y,6+hoverAmt*6,0,Math.PI*2);ctx.stroke();}
        const arrival=Math.max(0,(u-.82)/.18),arrivalGlow=arrival*arrival,peakHH=terrainHeight(d.nx,d.ny,t),pp=project(d.nx,d.ny,peakHH);
        if(arrivalGlow>.02){ctx.beginPath();ctx.strokeStyle=`rgba(224,90,53,${arrivalGlow*.5})`;ctx.lineWidth=1;ctx.arc(pp.x,pp.y,6+arrivalGlow*10,0,Math.PI*2);ctx.stroke();}
        ctx.font="600 9px 'Roboto Mono',monospace";ctx.fillStyle=`rgba(240,237,232,${.4+hoverAmt*.4+arrivalGlow*.3})`;ctx.textAlign="center";ctx.fillText(d.label,pp.x,pp.y-12);
      });
      const hubHH=terrainHeight(HUB.nx,HUB.ny,t),hp=project(HUB.nx,HUB.ny,hubHH);
      drawHubIcon(hp.x,hp.y,.9,Math.max(hoverAmt,breathe*.3));
      requestAnimationFrame(draw);
    }
    draw();
  })();
  </script>
</body>
</html>
