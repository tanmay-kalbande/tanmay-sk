<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a1a18"/>
      <stop offset="60%" stop-color="#111110"/>
      <stop offset="100%" stop-color="#0a0a09"/>
    </radialGradient>
    
    <!-- Glow for nodes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft inner shadow for depth -->
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k2="1" k3="-0.3"/>
    </filter>
    
    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e85d2e"/>
      <stop offset="50%" stop-color="#c8451a"/>
      <stop offset="100%" stop-color="#a33612"/>
    </linearGradient>
  </defs>
  
  <!-- Background with depth -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  
  <!-- Subtle star field -->
  <circle cx="10" cy="12" r="0.8" fill="#f0f0ee" opacity="0.25"/>
  <circle cx="54" cy="14" r="1.2" fill="#f0f0ee" opacity="0.4"/>
  <circle cx="8" cy="32" r="0.6" fill="#f0f0ee" opacity="0.15"/>
  <circle cx="56" cy="48" r="0.9" fill="#f0f0ee" opacity="0.2"/>
  <circle cx="18" cy="52" r="0.7" fill="#f0f0ee" opacity="0.18"/>
  <circle cx="48" cy="54" r="0.5" fill="#f0f0ee" opacity="0.22"/>
  <circle cx="32" cy="8" r="0.6" fill="#f0f0ee" opacity="0.12"/>
  
  <!-- Book spine -->
  <line x1="32" y1="21" x2="32" y2="46" stroke="url(#accent)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Left Page -->
  <path d="M 32 24 C 26 20, 19 21, 15 23.5 L 15 42.5 C 19 40.5, 26 39.5, 32 43.5" 
        fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Right Page -->
  <path d="M 32 24 C 38 20, 45 21, 49 23.5 L 49 42.5 C 45 40.5, 38 39.5, 32 43.5" 
        fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Constellation nodes with glow -->
  <circle cx="15" cy="23.5" r="3.4" fill="#e85d2e" fill-opacity="0.9" filter="url(#glow)"/>
  <circle cx="49" cy="23.5" r="3.4" fill="#e85d2e" fill-opacity="0.9" filter="url(#glow)"/>
  <circle cx="32" cy="21" r="5" fill="#f06535" filter="url(#glow)"/>
  
  <!-- Node inner highlights -->
  <circle cx="14.2" cy="22.7" r="1.1" fill="#fff" opacity="0.35"/>
  <circle cx="48.2" cy="22.7" r="1.1" fill="#fff" opacity="0.35"/>
  <circle cx="31.2" cy="20.2" r="1.6" fill="#fff" opacity="0.4"/>
  
  <!-- Page line accents -->
  <line x1="20" y1="29" x2="28" y2="28" stroke="#c8451a" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
  <line x1="20" y1="34" x2="28" y2="33" stroke="#c8451a" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
  <line x1="36" y1="28" x2="44" y2="29" stroke="#c8451a" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
  <line x1="36" y1="33" x2="44" y2="34" stroke="#c8451a" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
  
  <!-- Constellation connection lines (subtle) -->
  <line x1="15" y1="23.5" x2="32" y2="21" stroke="#c8451a" stroke-width="0.6" opacity="0.2" stroke-dasharray="1 2"/>
  <line x1="49" y1="23.5" x2="32" y2="21" stroke="#c8451a" stroke-width="0.6" opacity="0.2" stroke-dasharray="1 2"/>
  
  <!-- Refined border -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="12.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11.5" fill="none" stroke="#fff" stroke-opacity="0.04"/>
</svg>