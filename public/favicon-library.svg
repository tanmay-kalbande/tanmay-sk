<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="13" fill="#111110"/>
  <!-- Book spine line -->
  <line x1="32" y1="21" x2="32" y2="46" stroke="#c8451a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Left Page curve -->
  <path d="M 32 24 C 26 20, 19 21, 15 23.5 L 15 42.5 C 19 40.5, 26 39.5, 32 43.5" fill="none" stroke="#c8451a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Page curve -->
  <path d="M 32 24 C 38 20, 45 21, 49 23.5 L 49 42.5 C 45 40.5, 38 39.5, 32 43.5" fill="none" stroke="#c8451a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Nodes / Constellation points matching portfolio favicon -->
  <circle cx="15" cy="23.5" r="3.2" fill="#c8451a" fill-opacity="0.8"/>
  <circle cx="49" cy="23.5" r="3.2" fill="#c8451a" fill-opacity="0.8"/>
  <circle cx="32" cy="21" r="4.5" fill="#c8451a"/>
  <!-- Page line accents inside book -->
  <line x1="20" y1="29" x2="28" y2="28" stroke="#c8451a" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45"/>
  <line x1="20" y1="34" x2="28" y2="33" stroke="#c8451a" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45"/>
  <line x1="36" y1="28" x2="44" y2="29" stroke="#c8451a" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45"/>
  <line x1="36" y1="33" x2="44" y2="34" stroke="#c8451a" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45"/>
  <!-- Micro star dots -->
  <circle cx="52" cy="14" r="1.2" fill="#f0f0ee" fill-opacity="0.35"/>
  <circle cx="12" cy="30" r="1" fill="#f0f0ee" fill-opacity="0.2"/>
  <!-- Border -->
  <rect x=".5" y=".5" width="63" height="63" rx="12.5" fill="none" stroke="#fff" stroke-opacity="0.07"/>
</svg>
